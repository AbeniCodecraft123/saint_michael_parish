<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Celestial Church of Christ, Saint Michael Parish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --ivory:#FAF6EC; --midnight:#0F1B33; --gold:#C89B3C; --gold-soft:#E4C77A;
    --ink:#20222A; --white:#FFFFFF; --line: rgba(15,27,51,0.12); --shadow: 0 20px 50px rgba(15,27,51,0.12);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Work Sans', sans-serif; color:var(--ink); background:radial-gradient(ellipse 80% 60% at 50% 15%, #1c2e52 0%, var(--midnight) 55%, #0a1224 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:28px;}
a{color:inherit; text-decoration:none;}
h1{font-family:'Cormorant Garamond', serif; font-weight:600; color:var(--white); font-size:clamp(2rem,5vw,2.8rem); margin:18px 0 14px;}
.eyebrow{font-size:0.72rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold-soft); font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px;}
.eyebrow::before, .eyebrow::after{content:''; width:22px; height:1px; background:var(--gold-soft);}
.checkmark{
    width:72px; height:72px; border-radius:50%; background:rgba(200,155,60,0.15); border:1px solid var(--gold-soft);
    display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:1.8rem; color:var(--gold-soft);
}
p.lead{color:rgba(250,246,236,0.75); max-width:440px; margin:0 auto 34px; font-weight:300;}
.card{max-width:480px;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:14px 30px; border-radius:30px; font-size:0.92rem; font-weight:600;}
.btn-primary{background:var(--gold); color:var(--midnight);}
.btn-ghost{border:1px solid rgba(250,246,236,0.35); color:var(--ivory); margin-left:12px;}
</style>
</head>
<body>
  <div class="card">
    <div class="checkmark">✓</div>
    <div class="eyebrow" style="margin-top:24px;">Payment Received</div>
    <h1>Thank You for Giving</h1>
    <p class="lead">Your gift has been received with gratitude. May it be a blessing to the work of this parish and to God's Kingdom.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Homepage</a>
    <a href="{{ url_for('give') }}" class="btn btn-ghost">Give Again</a>
  </div>
</body>
</html>
