<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recent Activity — Saint Michael Parish Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF6EC; --midnight:#0F1B33; --gold:#C89B3C; --gold-soft:#E4C77A;
    --ink:#20222A; --white:#FFFFFF; --line:#E7E2D4; --muted:#8A8D97; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Work Sans', sans-serif; background:var(--ivory); color:var(--ink);}
  h1,h2{font-family:'Cormorant Garamond', serif; color:var(--midnight); font-weight:600;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:900px; margin:0 auto; padding:50px 28px 80px;}
  .back{display:inline-flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--gold); font-weight:600; margin-bottom:22px;}
  .eyebrow{font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px;}
  h1{font-size:2.1rem; margin-bottom:34px;}
  .type-tag{
    display:inline-block; padding:3px 11px; border-radius:20px; font-size:0.7rem; font-weight:700;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .type-tag.Sermon{background:rgba(76,110,145,0.14); color:#4C6E91;}
  .type-tag.Announcement{background:rgba(200,155,60,0.15); color:#a97e28;}
  .type-tag.Gallery{background:rgba(62,142,90,0.12); color:#3E8E5A;}
  table{width:100%; border-collapse:collapse; background:var(--white); border-radius:var(--radius); overflow:hidden; box-shadow:0 10px 30px rgba(15,27,51,0.06);}
  th{text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); padding:16px 20px; border-bottom:1px solid var(--line);}
  td{padding:16px 20px; border-bottom:1px solid var(--line); font-size:0.9rem;}
  tr:last-child td{border-bottom:none;}
  .empty{padding:40px; text-align:center; color:var(--muted); font-style:italic;}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="{{ url_for('admin_dashboard') }}">&larr; Back to Dashboard</a>
    <div class="eyebrow">Full History</div>
    <h1>Recent Activity</h1>

    <table>
      <thead><tr><th>Title</th><th>Type</th><th>Date</th></tr></thead>
      <tbody>
        {% for row in items %}
        <tr>
          <td>{{ row.title }}</td>
          <td><span class="type-tag {{ row.type }}">{{ row.type }}</span></td>
          <td>{{ row.date.strftime('%b %d, %Y, %I:%M %p') if row.date else '—' }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="empty">Nothing posted yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
